<section id="tab-password" class="tab-content">
  <div class="pwd-container">
    <h2><i class="fa-solid fa-shield-halved"></i> Gerador de Senhas</h2>
    <div class="pwd-display">
      <div class="pwd-output" id="pwdOutput">Clique em Gerar</div>
      <button class="pwd-copy-btn" onclick="copyPassword()">Copiar</button>
      <div class="pwd-strength-bar"><div class="pwd-strength-fill" id="pwdStrengthFill"></div></div>
    </div>
    <div class="pwd-options">
      <input type="range" class="pwd-slider" id="pwdLength" min="8" max="32" value="16">
      <input type="checkbox" id="pwdUpper" checked> Maiúsculas
      <input type="checkbox" id="pwdSymbols" checked> Símbolos
    </div>
    <button class="pwd-generate-btn" onclick="generatePassword()">Gerar Senha</button>
  </div>
</section>
