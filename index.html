            font-size: 0.68rem;
            padding: 3px;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 3px;
        }

        .planner-add-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* ========== ESTATÍSTICAS DE ESTUDO ========== */
        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255,255,255,0.025);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            transition: var(--transition);
        }

        .stat-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .stat-icon { font-size: 1.6rem; margin-bottom: 6px; display: block; }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--primary); font-family: 'Fira Code', monospace; display: block; margin-bottom: 3px; }
        .stat-label { font-size: 0.72rem; color: var(--text-muted); }

        .chart-wrap {
            background: rgba(255,255,255,0.025);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 14px;
        }

        .chart-title { font-size: 0.82rem; color: var(--accent); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }

        .bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 100px; }
        .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; justify-content: flex-end; }
        .bar-fill { width: 100%; border-radius: 3px 3px 0 0; background: linear-gradient(180deg, var(--primary), rgba(0,255,136,0.35)); transition: height 0.8s cubic-bezier(0.4,0,0.2,1); min-height: 3px; }
        .bar-label { font-size: 0.58rem; color: var(--text-muted); }
        .bar-value { font-size: 0.58rem; color: var(--accent); font-family: 'Fira Code', monospace; }

        /* ========== CRONÔMETRO POR MATÉRIA ========== */
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 14px;
        }

        .subject-card {
            background: rgba(255,255,255,0.025);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            transition: var(--transition);
        }

        .subject-card.running { border-color: var(--primary); background: rgba(0,255,136,0.03); box-shadow: 0 0 18px rgba(0,255,136,0.08); }
        .subject-card:hover { border-color: rgba(0,212,255,0.25); }

        .subject-name { font-size: 0.9rem; font-weight: 700; margin-bottom: 3px; display: flex; align-items: center; gap: 7px; }
        .subject-time { font-size: 1.4rem; font-family: 'Fira Code', monospace; font-weight: 700; color: var(--primary); margin: 6px 0; }
        .subject-card.running .subject-time { animation: timePulse 1s ease-in-out infinite; }
        @keyframes timePulse { 0%,100%{opacity:1;} 50%{opacity:0.65;} }
        .subject-total { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 8px; }

        .subject-controls { display: flex; gap: 5px; }
        .subj-btn { flex: 1; padding: 5px; border-radius: 7px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-size: 0.75rem; cursor: pointer; transition: var(--transition); }
        .subj-btn:hover { background: rgba(255,255,255,0.07); color: var(--text-main); }
        .subj-btn.start { color: var(--primary); border-color: rgba(0,255,136,0.28); }
        .subj-btn.start:hover { background: rgba(0,255,136,0.08); }
        .subj-btn.stop { color: var(--danger); border-color: rgba(255,71,87,0.28); }
        .subj-btn.stop:hover { background: rgba(255,71,87,0.08); }
        .subj-btn.del { color: var(--text-muted); }

        /* ========== QUIZ RÁPIDO ========== */
        .quiz-wrap { max-width: 580px; margin: 0 auto; }
        .quiz-cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 18px; }
        .quiz-cat-btn { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; padding: 12px; cursor: pointer; text-align: center; transition: var(--transition); font-size: 0.8rem; color: var(--text-muted); }
        .quiz-cat-btn:hover { border-color: var(--accent); color: var(--accent); }
        .quiz-cat-btn.sel { border-color: var(--primary); color: var(--primary); background: rgba(0,255,136,0.07); }
        .quiz-cat-icon { font-size: 1.4rem; display: block; margin-bottom: 5px; }

        .quiz-card { background: rgba(255,255,255,0.025); border: 1px solid var(--border); border-radius: 16px; padding: 22px; }
        .quiz-q { font-size: 1.05rem; font-weight: 600; color: var(--text-main); margin-bottom: 18px; line-height: 1.55; text-align: center; min-height: 55px; }
        .quiz-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 18px; }
        @media (max-width: 500px) { .quiz-opts { grid-template-columns: 1fr; } }
        .quiz-opt { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; cursor: pointer; transition: var(--transition); font-size: 0.87rem; color: var(--text-main); text-align: center; }
        .quiz-opt:hover { border-color: var(--accent); background: rgba(0,212,255,0.07); }
        .quiz-opt.correct { border-color: var(--success); background: rgba(46,213,115,0.13); color: var(--success); }
        .quiz-opt.wrong { border-color: var(--danger); background: rgba(255,71,87,0.1); color: var(--danger); }
        .quiz-opt.disabled { pointer-events: none; }

        .quiz-prog { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
        .quiz-prog-bar { flex: 1; height: 5px; background: rgba(255,255,255,0.07); border-radius: 3px; overflow: hidden; }
        .quiz-prog-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); border-radius: 3px; transition: width 0.4s ease; }
        .quiz-score-lbl { font-size: 0.78rem; color: var(--text-muted); font-family: 'Fira Code', monospace; }

        .quiz-result { text-align: center; padding: 28px; }
        .quiz-result-emoji { font-size: 2.8rem; display: block; margin-bottom: 10px; }
        .quiz-result-score { font-size: 1.9rem; font-weight: 700; color: var(--primary); font-family: 'Fira Code', monospace; }
        .quiz-result-lbl { font-size: 0.82rem; color: var(--text-muted); margin-top: 4px; }

        /* ========== PAINEL ADM MELHORADO ========== */
        .admin-stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }

        .adm-stat {
            background: rgba(255,71,87,0.05);
            border: 1px solid rgba(255,71,87,0.18);
            border-radius: 9px;
            padding: 10px;
            text-align: center;
        }

        .adm-stat-val { font-size: 1.2rem; font-weight: 700; font-family: 'Fira Code', monospace; color: var(--danger); display: block; }
        .adm-stat-lbl { font-size: 0.62rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        .adm-tabs { display: flex; gap: 5px; margin-bottom: 14px; flex-wrap: wrap; }
        .adm-tab { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 7px; padding: 5px 12px; font-size: 0.76rem; color: var(--text-muted); cursor: pointer; transition: var(--transition); }
        .adm-tab:hover { border-color: var(--danger); color: var(--danger); }
        .adm-tab.active { border-color: var(--danger); color: var(--danger); background: rgba(255,71,87,0.09); }

        .adm-pane { display: none; }
        .adm-pane.active { display: block; }

        .adm-set-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
        .adm-set-row label { font-size: 0.78rem; color: var(--text-muted); min-width: 90px; }
        .adm-set-row input[type="number"] { background: rgba(0,0,0,0.4); border: 1px solid var(--border); color: var(--text-main); padding: 7px 10px; border-radius: 7px; outline: none; font-family: 'Fira Code', monospace; font-size: 0.82rem; flex: 1; min-width: 90px; }
        .adm-set-row input:focus { border-color: var(--danger); }

        .adm-log { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,71,87,0.18); border-radius: 8px; padding: 10px; font-family: 'Fira Code', monospace; font-size: 0.72rem; color: var(--text-muted); max-height: 110px; overflow-y: auto; margin-top: 8px; }
        .adm-log-entry { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .adm-log-entry:last-child { border-bottom: none; }
        .adm-log-time { color: var(--accent); margin-right: 7px; }
        .adm-log-msg { color: var(--text-main); }

        /* ========== TOPBAR STUDY TIME ========== */
        .study-time-topbar {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,255,136,0.07);
            border: 1px solid rgba(0,255,136,0.18);
            color: var(--primary);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: 'Fira Code', monospace;
            cursor: default;
        }

        /* ========== POMODORO MODOS ========== */
        .pomo-modes { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 14px; }
        .pomo-mode { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; padding: 10px; cursor: pointer; text-align: center; transition: var(--transition); }
        .pomo-mode:hover { border-color: var(--accent); }
        .pomo-mode.active { border-color: var(--primary); background: rgba(0,255,136,0.07); }
        .pomo-mode-icon { font-size: 1.1rem; display: block; margin-bottom: 3px; }
        .pomo-mode-name { font-size: 0.72rem; color: var(--text-muted); }
        .pomo-mode.active .pomo-mode-name { color: var(--primary); }
        .pomo-mode-time { font-size: 0.62rem; color: var(--text-muted); font-family: 'Fira Code', monospace; }

        /* ========== CALC HISTORY ========== */
        .calc-hist { background: rgba(0,0,0,0.28); border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; margin-bottom: 10px; max-height: 70px; overflow-y: auto; font-family: 'Fira Code', monospace; font-size: 0.72rem; color: var(--text-muted); }
        .calc-hist-entry { padding: 1px 0; border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer; }
        .calc-hist-entry:hover { color: var(--accent); }
        .calc-hist-entry:last-child { border-bottom: none; }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 600px) {
            .fab-menu { width: 262px; right: -6px; }
            .fab-wrapper { bottom: 18px; right: 14px; }
            .admin-stats-row { grid-template-columns: repeat(2,1fr); }
        }

    </style>
</head>

<body>


<main class="main-content">
    <header class="topbar">
        
        <div class="topbar-right">
            <div class="title-display" id="playerTitleDisplay" title="Seu Título"><i class="fa-solid fa-crown"></i> <span id="playerTitleText">Novato</span></div>
            <div class="xp-display xp-progress-topbar" id="xpContainer" title="Seu XP Geekie">
                <div style="display:flex;align-items:center;gap:8px;">
                    <i class="fa-solid fa-star"></i> <span id="xpCount">0</span> XP
                </div>
                <div class="xp-progress-bar-wrap">
                    <div class="xp-progress-bar-fill" id="xpProgressFill" style="width:0%"></div>
                </div>
                <div class="xp-next-title" id="xpNextTitle">Próximo: Estudante (100 XP)</div>
            </div>
            <div class="coin-display" id="coinContainer" title="Suas Moedas" onclick="switchTab('tab-pets', document.querySelector('.pets-link'))"><i class="fa-solid fa-coins"></i> <span id="coinCount">0</span></div>
            <div class="study-time-topbar" id="studyTimeTopbar" title="Tempo de foco hoje">
                    <i class="fa-solid fa-clock"></i>
                    <span id="studyTimeTopbarDisplay">0h 00min</span>
                </div>
                <div class="clock-widget" id="realTimeClock">00:00:00</div>
            <button class="btn-icon" id="btnZenMode" title="Modo Zen" onclick="toggleZenMode()"><i class="fa-solid fa-expand"></i></button>
        </div>
    </header>

    <!-- TAB: GEEKIE -->
    <section id="tab-geekie" class="tab-content active" style="padding: 20px;">
        <div class="iframe-container theme-default" id="geekieIframeContainer">
            <div class="iframe-loading" id="iframeLoading">
                <div class="spinner"></div>
                <p>Carregando Portal Geekie...</p>
            </div>
            <iframe id="geekieIframe" data-src="https://dx1website.pages.dev/resumao/geekieoneplus/" title="Geekie One Portal" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation" style="display:none;"></iframe>
        </div>
    </section>

    <!-- TAB: GOOGLE -->
    <section id="tab-google" class="tab-content" style="padding: 20px;">
        <div class="iframe-container theme-default" id="googleIframeContainer">
            <iframe id="googleIframe" src="https://www.google.com/webhp?igu=1&safe=active&ssui=on" title="Google" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation"></iframe>
        </div>
    </section>

    <!-- TAB: NOTES -->
    <section id="tab-notes" class="tab-content">
        <div class="glass-card w-full" style="max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; height: 100%;">
            <h3 style="color: var(--accent);"><i class="fa-solid fa-book-journal-whills"></i> Bloco de Notas</h3>
            <div class="notes-toolbar">
                <select id="noteSelect" class="note-select" onchange="loadSelectedNote()"><option value="new">+ Nova Anotação...</option></select>
                <button class="btn btn-primary" onclick="saveNote()"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
                <button class="btn btn-outline" style="color:var(--danger); border-color:var(--danger);" onclick="deleteNote()"><i class="fa-solid fa-trash"></i></button>
            </div>
            <div class="notes-toolbar" style="margin-bottom: 10px; gap: 8px;">
                <button class="btn btn-outline" onclick="copyNoteContent()"><i class="fa-solid fa-copy"></i> Copiar</button>
                <button class="btn btn-outline" onclick="pasteNoteContent()"><i class="fa-solid fa-paste"></i> Colar</button>
                <button class="btn btn-outline" onclick="exportNote()"><i class="fa-solid fa-file-export"></i> Exportar (.txt)</button>
                <label class="btn btn-outline" style="cursor: pointer; margin: 0;"><i class="fa-solid fa-file-import"></i> Importar <input type="file" id="importNoteFile" accept=".txt" style="display: none;" onchange="importNote(event)"></label>
            </div>
            <div class="section-label">Fonte do Editor</div>
            <div class="note-font-picker" id="noteFontPicker"></div>
            <div class="section-label" style="margin-top:8px;">Tamanho da Fonte</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;" id="noteSizePicker">
                <button class="note-size-btn" onclick="setNoteSize(13)" data-size="13">A− Pequeno</button>
                <button class="note-size-btn active" onclick="setNoteSize(16)" data-size="16">A Médio</button>
                <button class="note-size-btn" onclick="setNoteSize(19)" data-size="19">A+ Grande</button>
                <button class="note-size-btn" onclick="setNoteSize(22)" data-size="22">A++ Maior</button>
                <button class="note-size-btn" onclick="setNoteSize(26)" data-size="26">A+++ Máximo</button>
            </div>
            <input type="text" id="noteTitle" class="note-title-input" placeholder="Título da Anotação">
            <!-- Barra de ferramentas extra da Notepad v11.3.0 -->
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center;">
                <button class="btn btn-outline" onclick="toggleNoteMarkdown()" id="btnMdPreview" style="font-size:0.8rem;"><i class="fa-brands fa-markdown"></i> Preview MD</button>
                <button class="btn btn-outline" onclick="clearNoteContent()" style="font-size:0.8rem;color:var(--danger);border-color:var(--danger);"><i class="fa-solid fa-eraser"></i> Limpar</button>
                <button class="btn btn-outline" onclick="insertNoteTimestamp()" style="font-size:0.8rem;"><i class="fa-solid fa-clock"></i> Inserir Data/Hora</button>
                <button class="btn btn-outline" onclick="insertBulletList()" style="font-size:0.8rem;"><i class="fa-solid fa-list-ul"></i> Lista</button>
                <button class="btn btn-outline" onclick="insertSeparator()" style="font-size:0.8rem;"><i class="fa-solid fa-minus"></i> Separador</button>
                <button class="btn btn-outline" onclick="countNoteWords()" style="font-size:0.8rem;"><i class="fa-solid fa-font"></i> Contar</button>
            </div>
            <div class="word-counter" id="noteWordCounter" style="display:none;"></div>
            <textarea id="noteContent" class="note-editor" placeholder="Digite suas anotações aqui..." oninput="liveNoteCounter()"></textarea>
            <div id="noteMarkdownPreview" class="md-preview" style="display:none; margin-top:8px; max-height:400px;"></div>
        </div>
    </section>

    <!-- TAB: STORE -->
    <section id="tab-store" class="tab-content">
        <div class="glass-card w-full" style="max-width: 900px; margin: 0 auto;">
            <h3 style="color: var(--gold);"><i class="fa-solid fa-store"></i> Loja de Temas Ubuntu</h3>
            <p style="color: var(--text-muted); margin-bottom: 16px;">Temas com efeitos especiais animados. Desbloqueie com seu XP de estudo!</p>
            <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;">
                <button class="btn btn-outline" onclick="openCustomThemeModal()" style="color:var(--gold);border-color:var(--gold);font-size:0.88rem;"><i class="fa-solid fa-wand-magic-sparkles"></i> Criar Tema Personalizado</button>
                <div id="customThemeEquippedBadge" style="display:none;font-size:0.8rem;color:var(--gold);background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.3);padding:5px 12px;border-radius:20px;"><i class="fa-solid fa-palette"></i> Tema Personalizado Ativo</div>
            </div>
            <div class="tab-search-wrap">
                <i class="fa-solid fa-search search-icon"></i>
                <input class="tab-search-bar" type="text" id="storeSearchBar" placeholder="Pesquisar tema..." oninput="filterStore(this.value)">
            </div>
            <div id="storeNoResults" style="display:none;text-align:center;color:var(--text-muted);padding:20px 0;"><i class="fa-solid fa-circle-xmark" style="font-size:1.5rem;display:block;margin-bottom:6px;"></i>Nenhum tema encontrado.</div>
            <div class="grid-dashboard mt-4" id="storeGrid"></div>
        </div>
    </section>

    <!-- TAB: TITLES -->
    <section id="tab-titles" class="tab-content">
        <div class="glass-card w-full" style="max-width: 900px; margin: 0 auto;">
            <h3 style="color: var(--gold
