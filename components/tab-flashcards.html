<section id="tab-flashcards" class="tab-content">
  <div class="glass-card">
    <h3><i class="fa-solid fa-bolt"></i> Revisão Ativa (Flashcards)</h3>
    <div class="flashcard-container" onclick="flipCard()">
      <div class="flashcard" id="flashcard">
        <div class="card-face card-front" id="cardFront">Carregando...</div>
        <div class="card-face card-back" id="cardBack">Carregando...</div>
      </div>
    </div>
    <div class="flashcard-rating">
      <button class="btn-rating-hard" onclick="rateCard('hard')">Difícil</button>
      <button class="btn-rating-easy" onclick="rateCard('easy')">Fácil</button>
    </div>
  </div>
</section>
