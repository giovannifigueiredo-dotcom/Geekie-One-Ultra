<section id="tab-planner" class="tab-content">
  <div class="glass-card w-full">
    <h3><i class="fa-solid fa-calendar-week"></i> Planner Semanal</h3>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-outline" onclick="plannerPrevWeek()">← Anterior</button>
      <span id="plannerWeekLabel"></span>
      <button class="btn btn-outline" onclick="plannerNextWeek()">Próxima →</button>
    </div>
    <div class="planner-grid" id="plannerGrid"></div>
  </div>
</section>
