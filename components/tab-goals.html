<section id="tab-goals" class="tab-content">
  <div class="glass-card">
    <h3><i class="fa-solid fa-list-check"></i> Metas de Estudo</h3>
    <div class="todo-input-group">
      <input type="text" id="todoInput" placeholder="Ex: Ler capítulo 4 de Biologia">
      <select id="todoPriority" class="priority-select">
        <option value="media">🟡 Média</option>
        <option value="alta">🔴 Alta</option>
        <option value="baixa">🟢 Baixa</option>
      </select>
      <button class="btn btn-primary" onclick="addTodo()"><i class="fa-solid fa-plus"></i></button>
    </div>
    <ul class="todo-list" id="todoList"></ul>
  </div>
</section>
