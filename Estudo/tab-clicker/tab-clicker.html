<section id="tab-clicker" class="tab-content">
  <div class="clicker-container">
    <div class="clicker-main">
      <div class="clicker-stats">
        <div class="clicker-stat"><span id="clickerPoints">0</span><span>Pontos</span></div>
        <div class="clicker-stat"><span id="clickerCPS">0.0</span><span>CPS</span></div>
      </div>
      <button class="clicker-button" id="clickerButton" onclick="handleClick(event)">
        <span class="clicker-button-icon"><i class="fa-solid fa-bolt"></i></span>
        <span class="clicker-button-text">CLICK!</span>
      </button>
    </div>
    <div class="clicker-sidebar">
      <div class="upgrade-list" id="upgradeList"></div>
      <div class="achievements-grid" id="achievementsList"></div>
    </div>
  </div>
</section>
