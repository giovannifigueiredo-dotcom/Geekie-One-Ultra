<section id="tab-notes" class="tab-content">
  <div class="glass-card w-full">
    <h3><i class="fa-solid fa-book-journal-whills"></i> Bloco de Notas</h3>
    <div class="notes-toolbar">
      <select id="noteSelect" class="note-select" onchange="loadSelectedNote()">
        <option value="new">+ Nova Anotação...</option>
      </select>
      <button class="btn btn-primary" onclick="saveNote()"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
      <button class="btn btn-outline" onclick="deleteNote()"><i class="fa-solid fa-trash"></i></button>
    </div>
    <!-- Font picker, size picker, toolbar MD, editor, preview -->
  </div>
</section>
