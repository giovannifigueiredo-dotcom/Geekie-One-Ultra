<section id="tab-codes" class="tab-content">
  <div class="glass-card w-full">
    <h3><i class="fa-solid fa-code"></i> Códigos de Resgate</h3>
    <div class="code-input-wrap">
      <input type="text" id="codeInput" placeholder="Digite o código..." onkeypress="if(event.key==='Enter')redeemCode()">
      <button class="btn btn-primary" onclick="redeemCode()"><i class="fa-solid fa-gift"></i> Resgatar</button>
    </div>
    <div class="codes-grid" id="codesGrid"></div>
  </div>
</section>
